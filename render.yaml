services:
  - type: web
    name: scotopic-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
  - type: static
    name: scotopic-client
    staticPublishPath: ./client
